[Unit]
Wants=network-online.target
After=network-online.target
# Keep retrying with bounded backoff instead of permanently hitting 3/5min.
StartLimitIntervalSec=0
# Optional: configure a site-owned notifier before enabling this hook.
# OnFailure=notify-failure@%n.service

[Service]
Restart=on-failure
RestartSec=5s
RestartSteps=6
RestartMaxDelaySec=5min
